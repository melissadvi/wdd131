<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="author" content="Melissa A. Vieira">
    <meta name="description" content="Share your experience with our products. Rate an item, choose the features you liked and leave a review in this quick and easy form.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="icon" href="data:,">
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="pr1">
        <fieldset>
            <legend>Product Name</legend>
            <label for="product">Product</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
        </fieldset>
        <fieldset>
            <legend>Overall Rating</legend>
            <div class="rating">
                <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> ★ <span class="sr-only"> 1 Star </span></label>
                <label for="rating2"><input type="radio" id="rating2" name="rating" value="2" required> ★★ <span class="sr-only"> 2 Stars </span></label>
                <label for="rating3"><input type="radio" id="rating3" name="rating" value="3" required> ★★★ <span class="sr-only"> 3 Stars </span></label>
                <label for="rating4"><input type="radio" id="rating4" name="rating" value="4" required> ★★★★ <span class="sr-only"> 4 Stars </span></label>
                <label for="rating5"><input type="radio" id="rating5" name="rating" value="5" required> ★★★★★ <span class="sr-only"> 5 Stars </span></label>
            </div>
        </fieldset>
        <fieldset>
            <legend>Date of Installation</legend>
            <label for="installdate">Date</label>
            <input type="date" id="installdate" name="installdate" required>
        </fieldset>
        <fieldset>
            <legend>Which features did you find useful in the product? (Check all that apply)</legend>
            <label for="durability"><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
            <label for="ease"><input type="checkbox" id="ease" name="features" value="ease-of-use"> Ease of Use</label>
            <label for="performance"><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
            <label for="design"><input type="checkbox" id="design" name="features" value="design"> Design</label>
        </fieldset>
        <fieldset>
            <legend>Written Review (Optional)</legend>
            <label for="review">Your review</label>
            <textarea id="review" name="review" rows="5"></textarea>
        </fieldset>
        <fieldset>
            <legend>Your Name (Optional)</legend>
            <label for="fullname">Name </label>
            <input type="text" id="fullname" name="fullname" autocomplete="name">
        </fieldset>
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy;2026 🪼 Melissa Adão Vieira 🪼 Brazil</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
